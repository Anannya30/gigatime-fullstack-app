# GigaTIME full-stack local orchestration.
# Bring everything up with:  docker compose up --build

services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gigatime_db}
      POSTGRES_USER: ${POSTGRES_USER:-gigatime_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigatime_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gigatime_user} -d ${POSTGRES_DB:-gigatime_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    # Build from the REPO ROOT (context: .) with the backend Dockerfile, so the
    # image bundles BOTH backend/ and ml/scripts/ (the latter lives outside
    # backend/). This makes the image self-contained — it no longer depends on
    # the ./ml/scripts volume mount below to find run_png_inference. The root
    # .dockerignore keeps the 5.3 GB ml/data/ out of the build context.
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Tag the built image so the celery service can reuse it instead of
    # building (and exporting) the same multi-GB torch image a second time.
    image: gigatime-backend:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: gigatime_backend.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      PYTHONPATH: /app/ml/scripts
    volumes:
      # Slide storage persisted on the host.
      - ./ml/data:/app/ml/data
      # ML inference code is now BAKED into the image; this mount only overlays it
      # for live editing during local dev (handy, but no longer required to run).
      - ./ml/scripts:/app/ml/scripts
      - ./ml/environment.yml:/app/ml/environment.yml
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      sh -c "python manage.py migrate --settings=gigatime_backend.settings.production &&
             gunicorn gigatime_backend.asgi:application -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"

  celery:
    # Reuse the image built by the backend service (identical Dockerfile);
    # avoids a duplicate build that previously OOM-killed the Docker daemon.
    image: gigatime-backend:latest
    depends_on:
      - backend
      - redis
      - db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: gigatime_backend.settings.production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      PYTHONPATH: /app/ml/scripts
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Redirect the multi-GB WSI scratch memmap off the C:-backed ext4 .vhdx
      # onto the /scratch bind mount below (D: drive, more free space).
      GIGATIME_SCRATCH_DIR: /scratch
    volumes:
      - ./ml/data:/app/ml/data
      - ./ml/scripts:/app/ml/scripts
      - ./ml/environment.yml:/app/ml/environment.yml
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Host D: drive (~103 GB free) backs the scratch memmap; keeps the giant
      # transient off the chronically-full C: drive that hosts the WSL .vhdx.
      - /mnt/d/gigatime-scratch:/scratch
    command: celery -A gigatime_backend worker --loglevel=info

  frontend:
    build: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
